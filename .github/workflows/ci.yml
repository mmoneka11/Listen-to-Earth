name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install Pillow numpy pyyaml xarray netCDF4
      - name: Pipeline smoke test (both paths, offline)
        run: python tests/smoke_test.py
