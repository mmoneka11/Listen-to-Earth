  </defs>

  <!-- Deep Cosmos Circle -->
  <circle cx="32" cy="32" r="31" fill="#060911" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="32" cy="32" r="28" fill="url(#haloGlow)" />

  <!-- Acoustic Sonification Wave Arcs (West & East sound expansion) -->
  <path d="M 11 23 A 25 25 0 0 0 11 41" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 6 18 A 31 31 0 0 0 6 46" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M 53 23 A 25 25 0 0 1 53 41" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 58 18 A 31 31 0 0 1 58 46" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Earth Globe Body -->
  <circle cx="32" cy="32" r="18" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Coordinate Grids (Latitude & Longitude telemetry) -->
  <ellipse cx="32" cy="32" rx="18" ry="7.5" fill="none" stroke="#bae6fd" stroke-width="0.9" opacity="0.5" />
  <ellipse cx="32" cy="32" rx="7.5" ry="18" fill="none" stroke="#bae6fd" stroke-width="0.9" opacity="0.5" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  <line x1="32" y1="14" x2="32" y2="50" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

  <!-- Harmonic Jukebox Waveform & Energy Core -->
  <circle cx="32" cy="32" r="8" fill="url(#glowPulse)" />
  <path d="M 22 32 Q 27 24 32 32 T 42 32" fill="none" stroke="#fff7ed" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
